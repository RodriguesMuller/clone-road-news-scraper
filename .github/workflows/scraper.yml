name: Road News Scraper

on:
  push:
    branches:
      - main
  schedule:
    # Runs every hour in UTC.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Uma coleta por vez: push em main + cron no mesmo minuto nao rodam em paralelo
# (evita chamadas de IA duplicadas no event intelligence).
concurrency:
  group: road-news-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Configure a repository secret named DATABASE_URL with the Supabase Postgres connection string."
            exit 1
          fi

          if ! echo "$DATABASE_URL" | grep -q '^postgresql://'; then
            echo "DATABASE_URL must start with postgresql://"
            exit 1
          fi

      - name: Debug database target
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          url = os.environ["DATABASE_URL"]
          parsed = urlparse(url)

          print("Database host:", parsed.hostname)
          print("Database port:", parsed.port)
          print("Database user:", parsed.username)
          print("Uses pooler:", "pooler.supabase.com" in (parsed.hostname or ""))
          PY

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Chave da OpenAI: aceita o secret OPENAI_API_KEY ou ROAD_NEWS_KEY (nome criado no repositório).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.ROAD_NEWS_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          # Triagem de eventos por IA desligada (2026-11-10): a Central de Evento passou a mostrar os
          # eventos que cada empresa escolhe acompanhar. O código segue em scraper/event_intelligence.py.
          EVENT_INTELLIGENCE_ENABLED: "false"
          SCRAPER_AI_SUMMARIES_ENABLED: "false"
        run: python main.py

