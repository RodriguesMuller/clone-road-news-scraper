name: Keepalive dos agendamentos

# Repositório público: o GitHub desliga os workflows agendados depois de 60 dias sem atividade
# no repositório. Toda semana este job reativa a coleta, o e-mail semanal e ele mesmo pela API
# (sem criar commit), o que reinicia essa contagem.
on:
  schedule:
    - cron: "41 9 * * 3" # quarta-feira, 06:41 em Brasília
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reativar workflows agendados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in scraper.yml weekly-news.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" && echo "ok: $wf"
          done
