# ==============================================================================
#  PAINEL DE CONTROLE DO SCRAPER  —  É AQUI QUE VOCÊ MEXE  👈
# ==============================================================================
#  Este arquivo controla TUDO o que o scraper coleta e guarda no banco.
#  Você NÃO precisa editar código Python para mudar os resultados: basta
#  alterar este arquivo, salvar e subir pro GitHub (o GitHub Actions sempre
#  usa a versão que estiver no repositório).
#
#  Três coisas aqui influenciam o output (os registros que entram no banco):
#     1) keywords    → filtram as NOTÍCIAS (G1, CNN, Band)
#     2) severities  → filtram os AVISOS de clima do INMET
#     3) as fontes   → quais sites/feeds são consultados
#
#  Dica: depois de editar, dá pra testar localmente com `python main.py`
#  (sem DATABASE_URL ele só mostra os resultados na tela, não grava).
# ==============================================================================


# ------------------------------------------------------------------------------
# 1) KEYWORDS  👈 PRINCIPAL PONTO DE AJUSTE
# ------------------------------------------------------------------------------
# Uma notícia do G1, CNN ou Band só é GUARDADA se o título (e o subtítulo/
# resumo, quando existir) contiver AO MENOS UMA das palavras abaixo.
#
# A busca considera apenas título e subtítulo/resumo da notícia, não o texto
# completo da página.
#
# Como o casamento funciona (importante para entender os resultados):
#   • Ignora maiúsculas/minúsculas:  "Acidente" == "acidente".
#   • Casa por PALAVRA INTEIRA: "ferido" NÃO casa com "ferimentos" — isso evita
#     falsos positivos, então prefira termos bem ligados a rodovia.
#   • Keyword com VÁRIAS palavras (ex.: "incêndio em caminhão") casa quando
#     TODAS as palavras aparecem no título (em qualquer posição), sem exigir a
#     frase exata.
#   • Keyword com pontuação (ex.: "BR-") casa por pedaço do texto (substring).
#
# Como ajustar:
#   • INCLUIR um termo  → adicione uma linha:   - novo termo
#   • REMOVER um termo  → apague a linha dele.
#   • Termos com símbolos (ex.: BR-) precisam de aspas:   "BR-"
#
# (Os avisos do INMET NÃO usam esta lista — eles são filtrados por severidade,
#  lá embaixo no item 3, porque "Tempestade" nunca casaria com estas palavras.)

keywords:
  - "BR-"
  - rodovia
  - estrada
  - carreta
  - caminhão
  - batida
  - bitrem
  - tombamento
  - engavetamento
  - bloqueio
  - interdição
  - carga espalhada
  - derramamento de carga
  - incêndio em caminhão
  - queda de barreira
  - deslizamento
  - ponte interditada
  - viaduto interditado
  - alagamento
  - enchente
  - neblina
  - baixa visibilidade


# ------------------------------------------------------------------------------
# 2) FONTES RSS  (G1 e CNN)  —  filtradas pelas keywords acima
# ------------------------------------------------------------------------------
# Para adicionar um feed RSS: copie um bloco e troque name/url/category.
#   name     → como a fonte aparece na coluna "source" do banco
#   url      → endereço do feed RSS
#   category → rótulo livre, salvo na coluna "category"
rss_sources:
  - name: "G1 - Brasil"
    url: "https://g1.globo.com/rss/g1/"
    category: "geral"

  - name: "CNN Brasil"
    url: "https://www.cnnbrasil.com.br/feed/"
    category: "geral"

  # G1 regional (um feed por estado). O G1 é o veículo mais frequente por trás
  # das buscas do Google News, mas lá chega sem foto; o feed direto traz a foto
  # da notícia (media:content) e o link original. Quando a mesma notícia vem
  # pelos dois caminhos, main.py mantém só a versão direta.
  # Avaliado em 2026-11-10: 24 feeds com robots.txt liberado, 93 notícias
  # relevantes para frota, 100% com foto. Mesmo filtro de keywords + frota.
  - { name: "G1 - SP", url: "https://g1.globo.com/rss/g1/sp/", category: "geral" }
  - { name: "G1 - MG", url: "https://g1.globo.com/rss/g1/mg/", category: "geral" }
  - { name: "G1 - PR", url: "https://g1.globo.com/rss/g1/pr/", category: "geral" }
  - { name: "G1 - RS", url: "https://g1.globo.com/rss/g1/rs/", category: "geral" }
  - { name: "G1 - SC", url: "https://g1.globo.com/rss/g1/sc/", category: "geral" }
  - { name: "G1 - RJ", url: "https://g1.globo.com/rss/g1/rj/", category: "geral" }
  - { name: "G1 - BA", url: "https://g1.globo.com/rss/g1/ba/", category: "geral" }
  - { name: "G1 - GO", url: "https://g1.globo.com/rss/g1/go/", category: "geral" }
  - { name: "G1 - MT", url: "https://g1.globo.com/rss/g1/mt/", category: "geral" }
  - { name: "G1 - MS", url: "https://g1.globo.com/rss/g1/ms/", category: "geral" }
  - { name: "G1 - ES", url: "https://g1.globo.com/rss/g1/es/", category: "geral" }
  - { name: "G1 - PE", url: "https://g1.globo.com/rss/g1/pe/", category: "geral" }
  - { name: "G1 - CE", url: "https://g1.globo.com/rss/g1/ce/", category: "geral" }
  - { name: "G1 - PA", url: "https://g1.globo.com/rss/g1/pa/", category: "geral" }
  - { name: "G1 - MA", url: "https://g1.globo.com/rss/g1/ma/", category: "geral" }
  - { name: "G1 - PB", url: "https://g1.globo.com/rss/g1/pb/", category: "geral" }
  - { name: "G1 - RN", url: "https://g1.globo.com/rss/g1/rn/", category: "geral" }
  - { name: "G1 - AL", url: "https://g1.globo.com/rss/g1/al/", category: "geral" }
  - { name: "G1 - SE", url: "https://g1.globo.com/rss/g1/se/", category: "geral" }
  - { name: "G1 - PI", url: "https://g1.globo.com/rss/g1/pi/", category: "geral" }
  - { name: "G1 - TO", url: "https://g1.globo.com/rss/g1/to/", category: "geral" }
  - { name: "G1 - RO", url: "https://g1.globo.com/rss/g1/ro/", category: "geral" }
  - { name: "G1 - AM", url: "https://g1.globo.com/rss/g1/am/", category: "geral" }
  - { name: "G1 - DF", url: "https://g1.globo.com/rss/g1/df/", category: "geral" }

  # Google News (busca) — agrega notícias rodoviárias de TODAS as fontes do
  # Brasil num único feed. As queries (parâmetro "q=", percent-encoded) já
  # filtram por rodovia/caminhão, então rendem alta relevância (~75-98 itens
  # rodoviários por busca). Os links são redirects (news.google.com/...).
  - name: "Google News - Incidentes em rodovia"
    url: "https://news.google.com/rss/search?q=%28rodovia+OR+%22BR-%22+OR+estrada%29+%28acidente+OR+interdi%C3%A7%C3%A3o+OR+interditada+OR+bloqueio+OR+tombou+OR+tombamento+OR+engavetamento+OR+capotou%29&hl=pt-BR&gl=BR&ceid=BR%3Apt"
    category: "rodovia"

  - name: "Google News - Caminhão/carreta"
    url: "https://news.google.com/rss/search?q=%28caminh%C3%A3o+OR+carreta+OR+bitrem%29+%28acidente+OR+tomba+OR+tombou+OR+capotou+OR+%22pega+fogo%22+OR+inc%C3%AAndio+OR+tombamento%29&hl=pt-BR&gl=BR&ceid=BR%3Apt"
    category: "rodovia"

  # Portais especializados (WordPress /feed/) — foco em transporte/rodovia
  - name: "Estradas.com.br"
    url: "https://estradas.com.br/feed/"
    category: "rodovia"

  - name: "Blog do Caminhoneiro"
    url: "https://blogdocaminhoneiro.com/feed/"
    category: "transporte"

  # Eventos nacionais graves com potencial de interromper corredores, acessos
  # portuários e o transporte rodoviário de cargas.
  - name: "Google News - Eventos logísticos Brasil"
    url: "https://news.google.com/rss/search?q=%28caminhoneiros+OR+%22transporte+de+cargas%22+OR+porto+OR+rodovia%29+%28paralisa%C3%A7%C3%A3o+OR+greve+OR+bloqueio+OR+interdi%C3%A7%C3%A3o+OR+protesto%29+when%3A7d&hl=pt-BR&gl=BR&ceid=BR%3Apt"
    category: "evento logístico"
    max_items: 30
    keywords:
      - caminhoneiros
      - paralisação
      - greve
      - bloqueio
      - interdição
      - porto

  # Infraestruturas internacionais capazes de afetar frete, combustível e
  # cadeias de suprimentos conectadas ao Brasil.
  - name: "Google News - Corredores logísticos internacionais"
    url: "https://news.google.com/rss/search?q=%28%22Strait+of+Hormuz%22+OR+%22Estreito+de+Ormuz%22+OR+%22Suez+Canal%22+OR+%22Red+Sea%22+OR+%22Bab+el-Mandeb%22+OR+%22Panama+Canal%22%29+%28closure+OR+blockade+OR+attack+OR+disruption+OR+closed+OR+bloqueio+OR+ataque+OR+interrup%C3%A7%C3%A3o%29+when%3A7d&hl=pt-BR&gl=BR&ceid=BR%3Apt"
    category: "logística internacional"
    max_items: 30
    # Corredores internacionais não citam rodovia: dispensa o filtro de
    # impacto na frota e usa só as keywords abaixo.
    fleet_filter: false
    keywords:
      - Strait of Hormuz
      - Estreito de Ormuz
      - Hormuz
      - Suez Canal
      - Canal de Suez
      - Red Sea
      - Mar Vermelho
      - Bab el-Mandeb
      - Panama Canal
      - Canal do Panamá

# ------------------------------------------------------------------------------
# 3) FONTES HTML  (Band)  —  filtradas pelas keywords acima
# ------------------------------------------------------------------------------
# Sites sem RSS, raspados direto do HTML. O campo "type" liga a fonte ao
# raspador específico em scraper/sources/html.py (não mexa no "type" sem
# criar/ajustar o raspador correspondente lá).
html_sources:
  - name: "Band - Notícias"
    url: "https://www.band.com.br/noticias"
    category: "geral"
    type: "band"

  # Arteris Fluminense — situação EM TEMPO REAL da rodovia (BR-101/RJ).
  # Lê a API JSON do mapa interativo (obras, acidentes, congestionamento).
  # Não usa keywords: toda ocorrência em rodovia é relevante. Deduplica por
  # hash do conteúdo (não há URL por ocorrência). "page_url" = página pública.
  - name: "Arteris Fluminense (tempo real)"
    url: "https://www.arteris.com.br/api/mapa-interativo/fluminense"
    page_url: "https://www.arteris.com.br/nossas-rodovias/fluminense/em-tempo-real/"
    category: "rodovia"
    type: "arteris"


# ------------------------------------------------------------------------------
# 4) AVISOS DO INMET  (clima)  👈 AJUSTE AQUI O QUE É CLIMA RELEVANTE
# ------------------------------------------------------------------------------
# Os avisos meteorológicos NÃO usam as keywords — eles são filtrados por:
#
#   severities → níveis de gravidade que você quer guardar. Opções, do mais
#                leve ao mais grave:
#                   "Perigo Potencial"  (amarelo)
#                   "Perigo"            (laranja)
#                   "Grande Perigo"     (vermelho)
#                Hoje pegamos só "Perigo" e "Grande Perigo". Para receber
#                TAMBÉM os mais leves, adicione "Perigo Potencial" à lista.
#
#   eventos    → (OPCIONAL) restringe a tipos específicos de fenômeno. Se
#                ficar comentado/ausente, TODOS os eventos da severidade
#                escolhida entram. Para filtrar, descomente e liste os tipos
#                (ex.: Tempestade, Chuvas Intensas, Vendaval, Acumulado de Chuva).
inmet_sources:
  - name: "INMET - Avisos Meteorológicos"
    url: "https://apiprevmet3.inmet.gov.br/avisos/rss"
    category: "clima"

    severities:
      - "Perigo"
      - "Grande Perigo"
      - "Perigo Potencial"

    eventos:
      - "Tempestade"
      - "Chuvas Intensas"
      - "Acumulado de Chuva"
      - "Vendaval"
      - "Granizo"
      - "Alagamento"
      - "Inundação"
