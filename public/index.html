<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Road News</title>
  <style>
    :root {
      --ink: #101614;
      --muted: #65706c;
      --line: #dfe6e2;
      --paper: #fff;
      --soft: #f4f7f5;
      --accent: #12d981;
      --accent-dark: #087548;
      --violet: #6247ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--soft); color: var(--ink); }
    header { background: var(--ink); color: white; border-bottom: 4px solid var(--accent); }
    .bar, main, footer { max-width: 1120px; margin: 0 auto; }
    .bar { padding: 22px 18px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .brand { font-size: 22px; font-weight: 800; line-height: 1.1; }
    .brand span { display: block; margin-top: 6px; color: #b6c3bd; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    button { border: 0; border-radius: 6px; background: var(--accent); color: #07100c; cursor: pointer; font-weight: 800; padding: 11px 16px; }
    button:disabled { cursor: wait; opacity: .65; }
    main { padding: 24px 18px 48px; }
    footer { padding: 0 18px 28px; color: var(--muted); font-size: 12px; }
    .notice { display: none; margin-bottom: 18px; border: 1px solid #edd780; background: #fff8d7; border-radius: 8px; padding: 12px 14px; color: #4a3b00; font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat, .panel, .item { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; }
    .stat { padding: 16px; min-height: 104px; }
    .label, h2 { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    h2 { margin: 0 0 14px; color: var(--ink); }
    .value { margin-top: 10px; font-size: 32px; font-weight: 800; line-height: 1; }
    .hint { margin-top: 8px; color: var(--muted); font-size: 13px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
    .panel { padding: 16px; }
    .list, .sources { display: grid; gap: 10px; }
    .item { padding: 14px 15px; }
    .alerts-panel { margin-bottom: 18px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .panel-head h2 { margin: 0; }
    .segmented { display: inline-flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: #f7fbf9; }
    .segmented button { background: transparent; color: var(--muted); border-radius: 6px; padding: 7px 9px; font-size: 12px; }
    .segmented button.active { background: var(--ink); color: #fff; }
    .alert-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .alert-card { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 13px; }
    .alert-card h3 { margin: 8px 0 6px; font-size: 15px; line-height: 1.35; }
    .alert-card p { margin: 0; color: #3f4e48; font-size: 13px; line-height: 1.45; }
    .alert-meta { display: flex; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 11px; font-weight: 800; }
    .alert-badge { border-radius: 999px; padding: 3px 7px; background: #edf3f0; color: #26342e; }
    .alert-badge.critical { background: #ffe2df; color: #8a1d13; }
    .alert-badge.high { background: #fff0cb; color: #7a4b00; }
    .alert-badge.medium { background: #e8f1ff; color: #124b85; }
    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .tag { border-radius: 999px; background: #daf8ea; color: var(--accent-dark); padding: 4px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; display: inline-flex; align-items: center; gap: 8px; }
    .tag.weather { background: #ebe7ff; color: var(--violet); }
    .tag.road { background: #d6fff0; color: #055c39; }
    .tag.trusted { background: rgba(18, 217, 129, .16); color: var(--accent-dark); border: 1px solid rgba(18, 217, 129, .35); }
    .tag .verified { background: var(--accent); color: #07100c; border-radius: 999px; padding: 2px 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
    .title { margin: 0; font-size: 16px; font-weight: 750; line-height: 1.35; }
    .title a { color: inherit; text-decoration: none; }
    .title a:hover { text-decoration: underline; }
    .actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .mini-button { border: 1px solid var(--line); background: #f7fbf9; color: var(--ink); border-radius: 6px; padding: 8px 10px; font-size: 12px; font-weight: 800; }
    .mini-button:hover { border-color: var(--accent); }
    .source { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 8px; color: var(--muted); font-size: 13px; }
    .source:last-child { border-bottom: 0; padding-bottom: 0; }
    .source b { color: var(--ink); }
    .source .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; background: rgba(18, 217, 129, .12); color: var(--accent-dark); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .source.trusted { color: var(--ink); font-weight: 700; }
    .source.trusted b { color: var(--accent-dark); }
    .tag.trusted { background: #d9f5ff; color: #0b5a72; }
    .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8, 15, 12, .78); padding: 18px; z-index: 10; }
    .modal.open { display: flex; }
    .modal-card { width: min(100%, 980px); max-height: 94vh; overflow: auto; background: var(--paper); border-radius: 8px; border: 1px solid var(--line); box-shadow: 0 18px 70px rgba(0,0,0,.35); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding: 14px 16px; }
    .modal-head strong { font-size: 15px; }
    .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .canvas-wrap { background: #111b16; padding: 16px; display: grid; place-items: center; }
    #shareCanvas { width: min(100%, 720px); height: auto; border-radius: 6px; box-shadow: 0 10px 34px rgba(0,0,0,.28); }
    .weekly-fab { position: fixed; right: 22px; bottom: 22px; z-index: 8; box-shadow: 0 14px 36px rgba(8, 15, 12, .25); }
    .weekly-body { padding: 18px; display: grid; gap: 14px; }
    #weekly-summary-report { display: grid; gap: 14px; }
    .weekly-hero { background: #0d1712; color: #f5fbf8; border-top: 4px solid var(--accent); padding: 20px; border-radius: 8px; }
    .weekly-logo { color: #f5fbf8; font-size: 24px; font-weight: 900; letter-spacing: .04em; }
    .weekly-logo:before { content: ""; display: inline-block; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 22px solid var(--accent); margin-right: 10px; transform: translateY(4px); }
    .weekly-sub { color: var(--accent); font-size: 12px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; margin-top: 6px; }
    .weekly-hero h3 { margin: 16px 0 8px; font-size: clamp(22px, 4vw, 30px); line-height: 1.12; }
    .weekly-hero p { margin: 0; color: #d7e4de; line-height: 1.55; }
    .risk-pill { display: inline-block; margin-top: 14px; border-radius: 999px; padding: 7px 12px; background: var(--accent); color: #07100c; font-weight: 900; }
    .weekly-period { margin-top: 12px; color: #aebdb6; font-size: 12px; font-weight: 700; }
    .weekly-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .weekly-kpi { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fff; min-height: 82px; }
    .weekly-kpi strong { display: block; margin-top: 8px; font-size: 22px; line-height: 1.05; }
    .weekly-kpi span { color: var(--muted); font-size: 10px; font-weight: 900; letter-spacing: .09em; text-transform: uppercase; }
    .weekly-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr); gap: 12px; }
    .weekly-section { border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: #fff; }
    .weekly-section h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .09em; }
    .weekly-section ul { margin: 0; padding-left: 18px; }
    .weekly-section li { margin: 7px 0; color: #25332d; line-height: 1.45; }
    .weekly-occurrences { display: grid; gap: 10px; }
    .weekly-occurrence { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fbfdfc; }
    .weekly-occurrence h5 { margin: 8px 0 6px; font-size: 14px; line-height: 1.35; }
    .weekly-occurrence p { margin: 0; color: #405049; font-size: 13px; line-height: 1.45; }
    .weekly-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); font-size: 11px; font-weight: 800; }
    .weekly-badge { border-radius: 999px; padding: 4px 7px; background: #edf3f0; color: #26342e; }
    .weekly-badge.risk-critico { background: #ffe2df; color: #8a1d13; }
    .weekly-badge.risk-alto { background: #fff0cb; color: #7a4b00; }
    .weekly-badge.risk-medio { background: #e8f1ff; color: #124b85; }
    .weekly-badge.risk-baixo { background: #e9f8ef; color: #0c6b3a; }
    .weekly-roads { display: flex; flex-wrap: wrap; gap: 8px; }
    .weekly-roads span { border: 1px solid rgba(18, 217, 129, .45); background: rgba(18, 217, 129, .10); color: var(--accent-dark); border-radius: 999px; padding: 6px 9px; font-weight: 800; }
    .weekly-footer { border-top: 1px solid var(--line); padding-top: 10px; color: var(--muted); font-size: 12px; }
    .weekly-loading { padding: 26px; color: var(--muted); }
    @media (max-width: 920px) { .weekly-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 820px) { .stats, .alert-list { grid-template-columns: repeat(2, minmax(0, 1fr)); } .layout { grid-template-columns: 1fr; } }
    @media (max-width: 720px) { .weekly-kpis, .weekly-grid { grid-template-columns: 1fr; } }
    @media (max-width: 640px) { .weekly-fab { left: 18px; right: 18px; } .modal-head { align-items: flex-start; } }
    @media (max-width: 480px) { .stats, .alert-list { grid-template-columns: 1fr; } .value { font-size: 28px; } }
    @media print {
      @page { size: A4; margin: 12mm; }
      html, body { width: 210mm; min-height: 297mm; background: #fff !important; }
      body * { visibility: hidden !important; }
      #weekly-summary-report, #weekly-summary-report * { visibility: visible !important; }
      #weekly-summary-report { position: absolute; left: 0; top: 0; width: 100%; padding: 0; background: #fff; color: #101614; gap: 10px; }
      header, main, footer, .weekly-fab, .modal-head, #imageModal, .modal-actions, button { display: none !important; }
      .modal, .modal.open, .modal-card, .weekly-body { position: static !important; inset: auto !important; display: block !important; padding: 0 !important; margin: 0 !important; max-height: none !important; overflow: visible !important; background: transparent !important; border: 0 !important; box-shadow: none !important; }
      .weekly-hero, .weekly-section, .weekly-kpi, .weekly-occurrence { break-inside: avoid; box-shadow: none; }
      .weekly-hero { padding: 14px; }
      .weekly-kpi { min-height: 64px; }
      .weekly-kpi strong { font-size: 18px; }
      .weekly-occurrence h5 { font-size: 13px; }
      .weekly-occurrence p, .weekly-section li { font-size: 12px; line-height: 1.35; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand">Road News<span>GitHub Actions + Supabase + Vercel frontend</span></div>
      <button id="refresh" type="button">Atualizar</button>
    </div>
  </header>

  <main>
    <div id="notice" class="notice"></div>
    <section class="stats" id="stats"></section>
    <section class="panel alerts-panel">
      <div class="panel-head">
        <h2>Alertas recentes</h2>
        <div id="alertWindows" class="segmented" aria-label="Janela de alertas recentes">
          <button type="button" data-hours="2">2h</button>
          <button type="button" data-hours="6" class="active">6h</button>
          <button type="button" data-hours="12">12h</button>
          <button type="button" data-hours="24">24h</button>
        </div>
      </div>
      <div id="recentAlerts" class="alert-list"></div>
    </section>
    <section class="layout">
      <div class="panel">
        <h2>Notícias recentes</h2>
        <div id="news" class="list"></div>
      </div>
      <aside class="panel">
        <h2>Fontes nas últimas 24h</h2>
        <div id="sources" class="sources"></div>
      </aside>
    </section>
  </main>

  <footer>
    O scraper roda no GitHub Actions e grava no Supabase. Esta página apenas lê dados públicos da tabela news.
  </footer>

  <div id="imageModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="imageTitle">
    <div class="modal-card">
      <div class="modal-head">
        <strong id="imageTitle">Imagem da notícia</strong>
        <div class="modal-actions">
          <button id="downloadImage" type="button">Baixar PNG</button>
          <button id="closeImage" type="button" class="mini-button">Fechar</button>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="shareCanvas" width="1080" height="1080"></canvas>
      </div>
    </div>
  </div>

  <button id="weeklySummaryButton" class="weekly-fab" type="button">Gerar resumo semanal</button>

  <div id="weeklyModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="weeklyTitle">
    <div class="modal-card">
      <div class="modal-head">
        <strong id="weeklyTitle">Resumo semanal</strong>
        <div class="modal-actions">
          <button id="printWeekly" type="button">Exportar resumo em PDF</button>
          <button id="jumpNews" type="button" class="mini-button">Ver notícias completas</button>
          <button id="closeWeekly" type="button" class="mini-button">Fechar</button>
        </div>
      </div>
      <div id="weeklyContent" class="weekly-body">
        <div class="weekly-loading">Preparando resumo semanal...</div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://vdyilgbqxnrwqgoairat.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_de-5vYgBsDImP6s8Y-Sc9Q_xqhcZsnn";
    const TABLE = "news";
    const BRASILIA_TIME_ZONE = "America/Sao_Paulo";

    const TRUSTED_SOURCES = new Set(["G1 - Brasil", "CNN Brasil", "Band - Notícias", "INMET - Avisos Meteorológicos", "Arteris Fluminense (tempo real)"]);
    const state = { items: [], recentItems: [], total: 0, alertHours: 6 };

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value == null ? "" : String(value);
      return div.innerHTML;
    }

    function parseBrasiliaDate(value) {
      if (!value) return null;
      if (value instanceof Date) return Number.isNaN(value.getTime()) ? null : value;
      if (typeof value === "number") {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? null : date;
      }
      let text = String(value).trim();
      const br = text.match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})$/);
      if (br) {
        text = `${br[3]}-${br[2]}-${br[1]}T${br[4]}:${br[5]}:00-03:00`;
      } else if (/^\d{4}-\d{2}-\d{2}T/.test(text) && !/(Z|[+-]\d{2}:?\d{2})$/i.test(text)) {
        text = `${text}-03:00`;
      }

      const date = new Date(text);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function age(iso) {
      if (!iso) return "-";
      const date = parseBrasiliaDate(iso);
      if (!date) return "-";
      const diff = Math.max(0, Date.now() - date.getTime());
      const minutes = Math.round(diff / 60000);
      if (minutes < 2) return "agora";
      if (minutes < 60) return `${minutes} min`;
      const hours = Math.round(minutes / 60);
      if (hours < 48) return `${hours}h`;
      return `${Math.round(hours / 24)}d`;
    }

    function formatDate(iso) {
      if (!iso) return "Data não informada";
      const date = parseBrasiliaDate(iso);
      if (!date) return "Data não informada";
      return new Intl.DateTimeFormat("pt-BR", {
        timeZone: BRASILIA_TIME_ZONE,
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      }).format(date);
    }

    function withinHours(item, hours) {
      const value = displayDateValue(item);
      return value >= Date.now() - hours * 60 * 60 * 1000;
    }

    function withinCollectionHours(item, hours) {
      const value = collectionDateValue(item);
      return value >= Date.now() - hours * 60 * 60 * 1000;
    }

    function collectionDateValue(item) {
      const date = parseBrasiliaDate(item.scraped_at || item.created_at || item.published_at);
      return date ? date.getTime() : 0;
    }

    function displayDateValue(item) {
      const preferred = item.type === "INMET"
        ? item.published_at || item.scraped_at || item.created_at
        : item.scraped_at || item.created_at || item.published_at;
      const date = parseBrasiliaDate(preferred);
      return date ? date.getTime() : 0;
    }

    function displayTime(item) {
      if (item.type === "INMET" && item.published_at) {
        return `Data do alerta: ${formatDate(item.published_at)}`;
      }
      return age(item.scraped_at || item.created_at || item.published_at);
    }

    function normalizeText(value) {
      return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function textForItem(item) {
      return normalizeText(`${item.title || ""} ${item.summary || ""} ${item.category || ""} ${item.type || ""}`);
    }

    function roadFromText(text) {
      const match = String(text || "").match(/\b((?:BR|SP|MG|RJ|RS|SC|PR|BA|GO|MT|MS|PA|PE|CE|ES|RO|TO|MA|PI|RN|PB|AL|SE|AM|AC|RR|AP|DF)[-\s]?\d{2,4})\b/i);
      return match ? match[1].replace(/\s+/g, "-").toUpperCase() : "";
    }

    function operationalRisk(item) {
      const text = textForItem(item);
      if (/roubo de carga|saque|bloqueio total|interdicao total|manifestacao|protesto/.test(text)) return ["critical", "Crítico"];
      if (/acidente|bloqueio|interdicao|interdita|tempestade|perigo|queda de barreira|tombamento|alagamento/.test(text)) return ["high", "Alto"];
      if (/lentidao|chuva forte|obra|interdicao parcial|congestionamento|pare-e-siga|fila/.test(text)) return ["medium", "Médio"];
      return ["", "Monitorar"];
    }

    function isActionableAlert(item) {
      return /acidente|interdicao|interdita|bloqueio|lentidao|roubo de carga|saque|manifestacao|protesto|alagamento|tempestade|queda de barreira|tombamento|obra|pare-e-siga|congestionamento|chuva forte|perigo/.test(textForItem(item));
    }

    function tagFor(item) {
      if (item.type === "INMET") return ["weather", "Clima"];
      if (item.type === "ARTERIS" || item.category === "rodovia") return ["road", "Rodovia"];
      return ["", "Noticia"];
    }

    async function supabaseFetch(path, options = {}) {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        ...options,
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          Prefer: "count=exact",
          ...(options.headers || {}),
        },
      });
      if (!response.ok) {
        const detail = await response.text();
        throw new Error(detail || `Supabase HTTP ${response.status}`);
      }
      return response;
    }

    async function loadNews() {
      if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes("COLE_AQUI")) {
        throw new Error("Configure SUPABASE_ANON_KEY no arquivo public/index.html antes do deploy.");
      }

      const columns = "title,url,source,category,published_at,scraped_at,created_at,type,summary";
      const recentColumns = columns;
      const since24h = encodeURIComponent(new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString());
      const newsResponse = await supabaseFetch(`${TABLE}?select=${columns}&order=created_at.desc&limit=50`);
      const inmetResponse = await supabaseFetch(`${TABLE}?select=${columns}&or=(source.ilike.*INMET*,type.eq.INMET)&order=published_at.desc&limit=20`);
      const recentResponse = await supabaseFetch(`${TABLE}?select=${recentColumns}&created_at=gte.${since24h}&order=created_at.desc&limit=300`);
      const countResponse = await supabaseFetch(`${TABLE}?select=id`, { method: "HEAD" });
      const latestNews = await newsResponse.json();
      const latestInmet = await inmetResponse.json();
      state.recentItems = await recentResponse.json();

      const merged = new Map();
      for (const item of [...latestNews, ...latestInmet]) {
        const key = item.url || `${item.title}|${item.published_at}|${item.source}`;
        merged.set(key, item);
      }
      state.items = [...merged.values()].sort((a, b) => displayDateValue(b) - displayDateValue(a));
      state.total = Number(countResponse.headers.get("content-range")?.split("/")?.[1] || state.items.length);
    }

    function renderStats() {
      const statsItems = state.recentItems.length ? state.recentItems : state.items;
      const lastHour = statsItems.filter((item) => withinCollectionHours(item, 1)).length;
      const lastDay = statsItems.filter((item) => withinCollectionHours(item, 24)).length;
      const lastCreated = [...statsItems, ...state.items]
        .map(collectionDateValue)
        .filter(Boolean)
        .sort((a, b) => b - a)[0];
      const cards = [
        ["Ultima coleta", age(lastCreated), "registro mais recente"],
        ["Ultima hora", lastHour, "registros recentes"],
        ["Ultimas 24h", lastDay, "na amostra carregada"],
        ["Total", state.total, "registros no Supabase"],
      ];

      document.getElementById("stats").innerHTML = cards.map(([label, value, hint]) => `
        <article class="stat">
          <div class="label">${label}</div>
          <div class="value">${value}</div>

    function renderSources() {
      const counts = new Map();
      const sourceItems = state.recentItems.length ? state.recentItems : state.items.filter((item) => withinCollectionHours(item, 24));
      sourceItems.forEach((item) => {
        const source = item.source || "Sem fonte";
        counts.set(source, (counts.get(source) || 0) + 1);
      });

      const rows = [...counts.entries()].sort((a, b) => {
        const aTrusted = TRUSTED_SOURCES.has(a[0]) ? 1 : 0;
        const bTrusted = TRUSTED_SOURCES.has(b[0]) ? 1 : 0;
        if (aTrusted !== bTrusted) return bTrusted - aTrusted;
        return b[1] - a[1];
      }).slice(0, 12);

      document.getElementById("sources").innerHTML = rows.length
        ? rows.map(([source, count]) => {
            const trusted = TRUSTED_SOURCES.has(source);
            return `<div class="source${trusted ? " trusted" : ""}"><span>${escapeHtml(source)}${trusted ? "<span class=\"badge\">Fonte confiável</span>" : ""}</span><b>${count}</b></div>`;
          }).join("")
        : `<div class="hint">Sem registros nas últimas 24h.</div>`;
    }

    function getRecentAlerts() {
      const merged = new Map();
      for (const item of [...state.recentItems, ...state.items]) {
        const key = item.url || `${item.title}|${item.published_at}|${item.source}`;
        if (!merged.has(key)) merged.set(key, item);
      }

      return [...merged.values()]
        .filter((item) => withinCollectionHours(item, state.alertHours))
        .filter(isActionableAlert)
        .sort((a, b) => {
          const riskScore = { critical: 4, high: 3, medium: 2, "": 1 };
          const [aRisk] = operationalRisk(a);
          const [bRisk] = operationalRisk(b);
          const aRoad = roadFromText(`${a.title || ""} ${a.summary || ""}`) ? 1 : 0;
          const bRoad = roadFromText(`${b.title || ""} ${b.summary || ""}`) ? 1 : 0;
          return (riskScore[bRisk] - riskScore[aRisk]) || (bRoad - aRoad) || (collectionDateValue(b) - collectionDateValue(a));
        })
        .slice(0, 8);
    }

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
      const words = String(text || "").replace(/\s+/g, " ").trim().split(" ");
      const lines = [];
      let line = "";

      for (const word of words) {
        const test = line ? `${line} ${word}` : word;
        if (ctx.measureText(test).width <= maxWidth) {
          line = test;
        } else {
          if (line) lines.push(line);
          line = word;
        }
        if (lines.length === maxLines) break;
      }
      if (line && lines.length < maxLines) lines.push(line);

      if (words.length && lines.length === maxLines) {
        const last = lines[maxLines - 1];
        let trimmed = last;
        while (ctx.measureText(`${trimmed}...`).width > maxWidth && trimmed.length > 8) {
          trimmed = trimmed.slice(0, -1);
        }
        lines[maxLines - 1] = `${trimmed.trim()}...`;
      }

      lines.forEach((content, index) => ctx.fillText(content, x, y + index * lineHeight));
      return y + lines.length * lineHeight;
    }

    function truncateClean(text, maxLength) {
      const clean = String(text || "").replace(/\s+/g, " ").trim();
      if (clean.length <= maxLength) return clean;

      const slice = clean.slice(0, maxLength + 1);
      const sentenceEnd = Math.max(slice.lastIndexOf(". "), slice.lastIndexOf("; "), slice.lastIndexOf("! "), slice.lastIndexOf("? "));
      if (sentenceEnd > maxLength * .55) return slice.slice(0, sentenceEnd + 1).trim();

      const separators = [", ", " e ", " ou ", " - ", " — ", " "];
      for (const sep of separators) {
        const index = slice.lastIndexOf(sep);
        if (index > maxLength * .62) return `${slice.slice(0, index).trim()}...`;
      }

      return `${clean.slice(0, maxLength).trim()}...`;
    }

    function decodeHtmlText(value) {
      const textarea = document.createElement("textarea");
      textarea.innerHTML = String(value || "").replace(/&nbsp;?/gi, " ");
      return textarea.value.replace(/&[a-zA-Z]+;?/g, " ");
    }

    function cleanDisplayText(value) {
      return decodeHtmlText(value)
        .replace(/<[^>]+>/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function firstMatch(text, patterns) {
      for (const pattern of patterns) {
        const match = text.match(pattern);
        if (match) return (match[1] || match[0]).trim();
      }
      return "";
    }

    function findRoad(text) {
      return firstMatch(text, [/\b((?:BR|SP|MG|RJ|RS|SC|PR|BA|GO|MT|MS|PA|PE|CE|ES|RO|TO|MA|PI|RN|PB|AL|SE|AM|AC|RR|AP|DF)[-\s]?\d{2,4})\b/i])
        .replace(/\s+/g, "-")
        .toUpperCase();
    }

    function findKm(text) {
      return firstMatch(text, [/\b(km\s*\d+(?:[,.]\d+)?)\b/i]).replace(/\s+/g, " ");
    }

    function findPlace(text) {
      const city = firstMatch(text, [
        /\bem\s+([A-ZÀ-ÿ][\wÀ-ÿ' -]{2,60}(?:\/[A-Z]{2}|,\s*[A-Z]{2})?)/,
        /\bentre\s+([A-ZÀ-ÿ][\wÀ-ÿ' -]{2,60})\s+e\s+[A-ZÀ-ÿ]/,
      ]);
      if (city) return city.replace(/\s+/g, " ").replace(/\s+(após|com|por|tem|registra|fica|está|foi)\b.*$/i, "").trim();

      return firstMatch(text, [
        /\b(Mato Grosso do Sul|Mato Grosso|Minas Gerais|Rio Grande do Sul|Rio Grande do Norte|Rio de Janeiro|Santa Catarina|São Paulo|Espírito Santo|Distrito Federal|Pará|Paraná|Ceará|Maranhão|Amazonas|Bahia|Goiás|Pernambuco|Rondônia|Tocantins)\b/i,
      ]);
    }

    function titleAction(title, summary) {
      const action = firstMatch(`${title} ${summary}`, [
        /\b(acidente|interdição|bloqueio|lentidão|congestionamento|obra|queda de barreira|manifestação|alagamento|incêndio|tombamento|colisão|chuvas intensas|tempestade)\b/i,
      ]);
      if (!action) return "";
      return action.charAt(0).toUpperCase() + action.slice(1).toLowerCase();
    }

    function placeForTitle(place) {
      const articles = {
        "Pará": "no",
        "Paraná": "no",
        "Ceará": "no",
        "Maranhão": "no",
        "Amazonas": "no",
        "Tocantins": "no",
        "Rio de Janeiro": "no",
        "Rio Grande do Sul": "no",
        "Rio Grande do Norte": "no",
        "Bahia": "na",
      };
      return `${articles[place] || "em"} ${place}`;
    }

    function buildImageTitle(item) {
      const originalTitle = cleanDisplayText(item.title);
      const summary = cleanDisplayText(item.summary);
      const text = `${originalTitle} ${summary}`;
      const road = findRoad(text);
      const km = findKm(text);
      const place = findPlace(text);

      if (item.type === "INMET") {
        const weather = originalTitle.match(/^([A-Za-zÀ-ÿ ]+)\s*-\s*([A-Za-zÀ-ÿ ]+)$/);
        if (weather) {
          const event = weather[1].trim();
          const severity = weather[2].trim();
          return place ? `${event}: ${severity} ${placeForTitle(place)}` : `${event}: ${severity}`;
        }
      }

      const action = titleAction(originalTitle, summary);
      if (action && road) {
        const parts = [`${action} na ${road}`];
        if (km) parts.push(km);
        if (place && !parts.join(" ").toLowerCase().includes(place.toLowerCase())) parts.push(placeForTitle(place));
        return parts.join(" ");
      }

      if (road && !originalTitle.toLowerCase().includes(road.toLowerCase())) {
        return `${originalTitle} na ${road}`;
      }

      return originalTitle || "Resumo da notícia";
    }

    function summaryFallback(item) {
      const title = decodeHtmlText(item.title || "").trim();
      const weather = title.match(/^([A-Za-zÀ-ÿ ]+)\s*-\s*([A-Za-zÀ-ÿ ]+)$/);
      if (item.type === "INMET" && weather) {
        return `há alerta de ${weather[1].trim().toLowerCase()} com ${weather[2].trim().toLowerCase()}, conforme aviso meteorológico publicado pelo INMET.`;
      }
      return title || "Resumo indisponível no banco. Abra a notícia para ver os detalhes completos.";
    }

    function smartSummary(item) {
      let text = decodeHtmlText(item.summary).replace(/<[^>]+>/g, " ");
      text = text
        .replace(/\s+/g, " ")
        .replace(/\bINMET publica aviso iniciando em:\s*[^.]+\.?\s*/i, "")
        .replace(/\bAviso para as [ÁA]reas?:\s*/i, "Áreas afetadas: ")
        .replace(/\bBaixo risco de\b/gi, "Risco de")
        .trim();

      if (/^Na regi(?:ã|a)o (?:de|do|da) [^,]{2,80},?$/i.test(text)) {
        text = "";
      }

      if (!text) {
        text = summaryFallback(item);
      }

      if (item.type === "INMET" && /chuvas intensas/i.test(item.title || "")) {
        text = text
          .replace(/^Chuva entre/i, "Chuva intensa com acumulados entre")
          .replace(/,\s*chuva entre/i, ", chuva intensa com acumulados entre")
          .replace(/ventos intensos/i, "ventos fortes");
      }

      text = text
        .replace(/^(Na região da ((?:BR|SP|MG|RJ|RS|SC|PR|BA|GO|MT|MS|PA|PE|CE|ES|RO|TO|MA|PI|RN|PB|AL|SE|AM|AC|RR|AP|DF)-?\d{2,4}),)\s+\2\s+/i, "$1 ")
        .replace(/\s+,/g, ",")
        .replace(/\s+\./g, ".")
        .replace(/\s+/g, " ")
        .trim();

      return truncateClean(text, 285);
    }

    function drawGrid(ctx, width, height) {
      ctx.strokeStyle = "rgba(18,217,129,.10)";
      ctx.lineWidth = 2;
      for (let x = -120; x < width + 120; x += 92) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.bezierCurveTo(x + 80, 260, x - 120, 600, x + 70, height);
        ctx.stroke();
      }
      for (let y = -80; y < height + 80; y += 86) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(300, y + 70, 620, y - 95, width, y + 40);
        ctx.stroke();
      }
    }

    function drawShareImage(item) {
      const canvas = document.getElementById("shareCanvas");
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;
      const summary = smartSummary(item);
      const imageTitle = buildImageTitle(item);
      const source = [item.source, item.category].filter(Boolean).join(" · ");
      const published = formatDate(item.published_at || item.scraped_at || item.created_at);

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#0d1712";
      ctx.fillRect(0, 0, w, h);
      drawGrid(ctx, w, h);

      const cardX = 86;
      const cardY = 84;
      const cardW = w - 172;
      const cardH = h - 168;
      ctx.fillStyle = "rgba(18,217,129,.075)";
      ctx.fillRect(cardX, cardY, cardW, cardH);
      ctx.strokeStyle = "rgba(18,217,129,.48)";
      ctx.lineWidth = 3;
      ctx.strokeRect(cardX, cardY, cardW, cardH);

      ctx.fillStyle = "#12d981";
      ctx.beginPath();
      ctx.moveTo(158, 84);
      ctx.lineTo(224, 84);
      ctx.lineTo(191, 128);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#d7e4de";
      ctx.font = "800 46px Segoe UI, Arial, sans-serif";
      ctx.fillText("OVERHAUL", 248, 126);
      ctx.fillStyle = "#12d981";
      ctx.font = "800 25px Segoe UI, Arial, sans-serif";
      ctx.fillText("ROAD NEWS", 250, 166);

      ctx.fillStyle = "#12d981";
      ctx.font = "800 30px Segoe UI, Arial, sans-serif";
      ctx.fillText("Resumo da notícia", 136, 258);

      ctx.fillStyle = "#f5fbf8";
      ctx.font = "900 44px Segoe UI, Arial, sans-serif";
      let nextY = wrapCanvasText(ctx, imageTitle, 136, 326, 808, 55, 3);
      nextY += 16;

      ctx.fillStyle = "rgba(255,255,255,.09)";
      ctx.fillRect(136, nextY + 22, 808, 310);
      ctx.strokeStyle = "rgba(18,217,129,.35)";
      ctx.strokeRect(136, nextY + 22, 808, 310);

      ctx.fillStyle = "#d7e4de";
      ctx.font = "600 27px Segoe UI, Arial, sans-serif";
      wrapCanvasText(ctx, summary, 168, nextY + 78, 744, 39, 6);

      ctx.fillStyle = "#12d981";
      ctx.font = "800 23px Segoe UI, Arial, sans-serif";
      ctx.fillText("Fonte", 136, 894);
      ctx.fillStyle = "#f5fbf8";
      ctx.font = "700 27px Segoe UI, Arial, sans-serif";
      wrapCanvasText(ctx, source || "Road News", 136, 932, 560, 34, 2);

      ctx.fillStyle = "#d7e4de";
      ctx.font = "700 22px Segoe UI, Arial, sans-serif";
      ctx.textAlign = "right";
      ctx.fillText("Publicado em", 944, 910);
      ctx.fillStyle = "#f5fbf8";
      ctx.font = "800 24px Segoe UI, Arial, sans-serif";
      ctx.fillText(published, 944, 946);
      ctx.fillStyle = "#12d981";
      ctx.font = "800 24px Segoe UI, Arial, sans-serif";
      ctx.fillText("road-news", 944, 984);
      ctx.textAlign = "left";
    }

            <div class="weekly-section">
              <h4>Principais pontos da semana</h4>
              ${renderList(asArray(summary.weekly_points || summary.operational_points).slice(0, 3))}
            </div>
            <div class="weekly-section">
              <h4>Rodovias, regiões e categorias</h4>
              ${renderPills(summary.featured_roads || context.roads, "Sem rodovia crítica isolada")}
              <div style="height:8px"></div>
              ${renderPills(summary.featured_regions || context.regions, "Sem região dominante")}
              <div style="height:8px"></div>
              ${renderPills(summary.featured_categories || context.category_counts, "Sem categoria dominante")}
            </div>
          </section>
          <section class="weekly-section">
            <h4>Top ocorrências relevantes</h4>
            ${renderTopOccurrences(summary, context)}
          </section>
          <section class="weekly-grid">
            <div class="weekly-section">
              <h4>INMET: regiões em perigo</h4>
              ${renderList(asArray(summary.inmet_regions || summary.weather_notes).slice(0, 5))}
            </div>
            <div class="weekly-section">
              <h4>Recomendações operacionais</h4>
              ${renderList(asArray(summary.recommendations).slice(0, 3))}
            </div>
          </section>
          <div class="weekly-footer">Relatório gerado automaticamente pelo Road News. Base analisada: ${Number(context.total || 0)} registros.</div>
        </div>
      `;
    }

    async function openWeeklySummary() {
      const modal = document.getElementById("weeklyModal");
      const content = document.getElementById("weeklyContent");
      const button = document.getElementById("weeklySummaryButton");
      modal.classList.add("open");
      content.innerHTML = `<div class="weekly-loading">Preparando resumo semanal...</div>`;
      button.disabled = true;
      try {
        const response = await fetch("/api/weekly-summary", { method: "POST" });
        const contentType = response.headers.get("content-type") || "";
        const data = contentType.includes("application/json")
          ? await response.json()
          : { error: (await response.text()).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim() };
        if (!response.ok) throw new Error(data.error || "Erro ao gerar resumo semanal");
        renderWeeklySummary(data);
      } catch (error) {
        content.innerHTML = `<div class="notice" style="display:block">${escapeHtml(error.message)}</div>`;
      } finally {
        button.disabled = false;
      }
    }

    function closeWeeklySummary() {
      document.getElementById("weeklyModal").classList.remove("open");
    }

    function printWeeklySummary() {
      if (document.getElementById("weekly-summary-report")) window.print();
    }

    function jumpToNews() {
      closeWeeklySummary();
      document.querySelector(".layout")?.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function setNotice(message) {
      const notice = document.getElementById("notice");
      notice.textContent = message || "";
      notice.style.display = message ? "block" : "none";
    }

    async function refresh() {
      const button = document.getElementById("refresh");
      button.disabled = true;
      setNotice("");
      try {
        await loadNews();
      } catch (error) {
        state.items = [];
        state.recentItems = [];
        state.total = 0;
        setNotice(error.message);
      } finally {
        renderStats();
        renderRecentAlerts();
        renderSources();
        renderNews();
        button.disabled = false;
      }
    }

    document.getElementById("refresh").addEventListener("click", refresh);
    document.getElementById("alertWindows").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-hours]");
      if (!button) return;
      state.alertHours = Number(button.dataset.hours);
      document.querySelectorAll("#alertWindows button").forEach((item) => item.classList.toggle("active", item === button));
      renderRecentAlerts();
    });
    document.getElementById("news").addEventListener("click", (event) => {
      const button = event.target.closest(".make-image");
      if (button) openImageModal(Number(button.dataset.index));
    });
    document.getElementById("closeImage").addEventListener("click", closeImageModal);
    document.getElementById("downloadImage").addEventListener("click", downloadCurrentImage);
    document.getElementById("weeklySummaryButton").addEventListener("click", openWeeklySummary);
    document.getElementById("printWeekly").addEventListener("click", printWeeklySummary);
    document.getElementById("jumpNews").addEventListener("click", jumpToNews);
    document.getElementById("closeWeekly").addEventListener("click", closeWeeklySummary);
    document.getElementById("imageModal").addEventListener("click", (event) => {
      if (event.target.id === "imageModal") closeImageModal();
    });
    document.getElementById("weeklyModal").addEventListener("click", (event) => {
      if (event.target.id === "weeklyModal") closeWeeklySummary();
    });
    refresh();
  </script>
</body>
</html>
